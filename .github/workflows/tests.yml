# Prüft bei jedem Push und jedem Pull Request, ob die Anwendung noch tut,
# was sie soll. Dieselben Befehle laufen auch lokal:
#   ruff check .
#   pytest
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.11 ist die älteste Version, mit der die Abhängigkeiten laufen
        # (Markdown verlangt sie). 3.15 ist die neueste Fassung und läuft auf
        # dem Windows-Rechner, 3.14 auf den Fedora-Rechnern - was dort
        # auffällt, soll hier auffallen. 3.13 bringt Debian 13 mit.
        python-version: ["3.11", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Auf echte Fehler prüfen
        run: ruff check .

      - name: Tests ausführen
        run: pytest
