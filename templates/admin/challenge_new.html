{% extends "base.html" %}
{% block content %}

<h1 class="mb-4">➕ Neuer Wettbewerb</h1>

<div class="event-card">

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label">Titel des Wettbewerbs</label>
    <input type="text" name="title" class="form-control form-control-lg"
      placeholder="z. B. {{ site_settings.site_name }} – Runde 1" required>

    <div class="row g-3 mt-1">
      <div class="col-md-6">
        <label class="form-label">Startzeit <span class="text-secondary">(optional)</span></label>
        <input type="datetime-local" name="start_time" class="form-control">
      </div>
      <div class="col-md-6">
        <label class="form-label">Endzeit <span class="text-secondary">(optional)</span></label>
        <input type="datetime-local" name="end_time" class="form-control">
      </div>
    </div>

    <p class="text-secondary small mt-2 mb-0">
      Ist eine Startzeit gesetzt, zeigt die Countdown-Seite einen Countdown bis zum Beginn.
      Die Zeiten lassen sich später jederzeit ändern.
    </p>

    <button class="btn btn-primary mt-4">
      💾 Wettbewerb anlegen
    </button>
  </form>

</div>

<a href="/admin/challenges" class="text-secondary mt-4 d-block">
  ← zurück zur Übersicht
</a>

{% endblock %}
