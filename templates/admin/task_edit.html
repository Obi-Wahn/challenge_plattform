{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="event-card">
            <h2 class="mb-4">✏️ Aufgabe bearbeiten</h2>

            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label class="form-label">Titel</label>
                    <input type="text" name="title" class="form-control" value="{{ task.title }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Beschreibung (Markdown)</label>
                    <textarea id="description-editor" name="description" class="form-control"
                        rows="5">{{ task.description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Max. Punkte</label>
                    <input type="number" name="max_points" class="form-control" value="{{ task.max_points }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Hinweis (optional, während des Events freischaltbar)</label>
                    <textarea name="hint" class="form-control" rows="2"
                        placeholder="Tipp, falls ein Team nicht weiterkommt">{{ task.hint or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Erlaubtes Dateiformat</label>
                    <select name="allowed_extension" class="form-select">
                        {% for extension, label in task_formats.items() %}
                        <option value="{{ extension }}" {% if task.allowed_extension==extension %}selected{% endif %}>
                            {{ extension }} ({{ label }})
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin.challenge_tasks', cid=task.challenge_id) }}"
                        class="btn btn-outline-secondary">Abbrechen</a>
                    <button type="submit" class="btn btn-primary">💾 Speichern</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- EasyMDE Markdown Editor -->
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/easymde/easymde.min.css') }}">
<script src="{{ url_for('static', filename='vendor/easymde/easymde.min.js') }}"></script>
<script>
    var easyMDE = new EasyMDE({
        element: document.getElementById('description-editor'),
        spellChecker: false,
        status: false,
        autoDownloadFontAwesome: false,
        // No "guide" button: it links to an external website, which is
        // unreachable on the offline machine this runs on.
        toolbar: ["bold", "italic", "heading", "|", "quote", "code", "unordered-list", "ordered-list", "|", "preview"]
    });
</script>

{% endblock %}
