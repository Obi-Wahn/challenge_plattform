{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center text-center">
  <div class="col-md-5">

    <h2 class="mb-4">🔐 Jury-Anmeldung</h2>

    {% if error %}
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <div class="event-card">

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-4">
          <input type="password" name="password" class="form-control form-control-lg" required
            placeholder="{% if bewertungszugang %}Passwort{% else %}Admin-Passwort{% endif %}"
            aria-label="Passwort">
          {% if bewertungszugang %}
          {# Ein Feld für beide Zugänge: Das Passwort entscheidet, wohin es geht. #}
          <div class="form-text text-secondary mt-2">
            Admin-Passwort oder Passwort für die Bewertung
          </div>
          {% endif %}
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100">
          🔐 Anmelden
        </button>
      </form>

    </div>

  </div>
</div>

{% endblock %}
