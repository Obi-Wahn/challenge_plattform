{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center text-center">
  <div class="col-md-7">

    <h1 class="mb-3">
      Willkommen!<br>
      <span style="color: var(--accent)">{{ site_settings.site_name }}</span>
    </h1>

    <p class="text-secondary mb-4">
      {{ site_settings.tagline }}
    </p>

    {% if error %}
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="team" class="form-control form-control-lg mb-3" placeholder="Teamname" required>

      <input type="password" name="password" class="form-control form-control-lg mb-3" placeholder="Passwort setzen"
        required>

      <button type="submit" class="btn btn-primary btn-lg w-100">
        🚀 Team registrieren
      </button>
    </form>

    <p class="mt-3 mb-0 text-secondary small">
      Bereits registriert? <a href="{{ url_for('public.login') }}">Hier einloggen</a>
    </p>

    {% if qr_code_data %}
    <div class="mt-5">
      <img src="data:image/png;base64,{{ qr_code_data }}" alt="QR-Code zu dieser Seite"
        style="width: 160px; height: 160px; background: white; padding: 8px; border-radius: 8px;">
      <p class="text-secondary small mt-2">📱 Für Freunde: QR-Code scannen zum Beitreten</p>
    </div>
    {% endif %}

  </div>

</div>
</div>

{% endblock %}
