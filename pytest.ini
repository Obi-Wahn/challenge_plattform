[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
addopts = -q
# Veraltete SQLAlchemy-Aufrufe sollen auffallen, solange sie noch
# funktionieren - nicht erst, wenn eine neue Version sie entfernt.
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
# Ein datetime-Objekt direkt an sqlite3 ist seit Python 3.12 veraltet; die
# Anwendung reicht Zeiten deshalb als Text weiter (#61), und so soll es bleiben.
    error:The default datetime adapter is deprecated:DeprecationWarning
